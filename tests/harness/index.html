<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BotGuard 测试页 — 营销活动模拟</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f6fb;
      color: #1c2333;
      padding: 24px;
      /* make the page tall so scrolling has somewhere to go */
      min-height: 2200px;
    }
    .card {
      max-width: 720px;
      margin: 0 auto 24px;
      background: #fff;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 6px 24px rgba(20, 30, 60, .08);
    }
    h1 { margin-top: 0; font-size: 22px; }
    .btn {
      display: inline-block;
      border: 0;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 15px;
      cursor: pointer;
      background: #3b6ef6;
      color: #fff;
      margin: 6px 8px 6px 0;
    }
    .btn.secondary { background: #e8edfb; color: #2748a8; }
    input[type=text] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cfd6e6;
      border-radius: 10px;
      font-size: 15px;
      margin: 8px 0 16px;
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .target {
      width: 120px;
      height: 64px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff8a3d, #ff5d8f);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      user-select: none;
    }
    #status { font-size: 13px; color: #5a667f; }
    .pad { height: 600px; }
    code { background: #eef1f8; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎁 限时营销活动(测试页)</h1>
    <p id="status">SDK 加载中…</p>
    <div class="row">
      <button class="btn" id="claim">立即领取</button>
      <button class="btn secondary" id="share">分享好友</button>
      <button class="btn secondary" id="coupon">领优惠券</button>
    </div>
  </div>

  <div class="card">
    <h1>报名表单</h1>
    <label>手机号</label>
    <input type="text" id="phone" placeholder="请输入手机号" autocomplete="off" />
    <label>验证码</label>
    <input type="text" id="code" placeholder="4 位验证码" autocomplete="off" />
    <button class="btn" id="submit">提交报名</button>
  </div>

  <div class="card">
    <h1>点击目标</h1>
    <div class="target" id="target">点我</div>
  </div>

  <div class="card pad">
    <h1>滚动区域</h1>
    <p>向下滚动以产生 scroll 信号。</p>
  </div>

  <div class="card">
    <h1>页脚</h1>
    <button class="btn secondary" id="bottom">底部按钮</button>
  </div>

  <script src="/botguard.min.js"></script>
  <script>
    // SDK exposes window.BotGuardSDK.init; the init helper also sets window.BotGuard.
    const guard = window.BotGuardSDK.init({
      endpoint: '/api/report',
      flushInterval: 2000,
      extra: { campaign: 'summer-sale-2026', page: 'harness' }
    });
    document.getElementById('status').textContent =
      'SDK 已加载,采集运行中';

    // Expose a test hook so the driver can force a final flush and read reports.
    window.__bgFlush = () => new Promise((resolve) => {
      window.BotGuard.flush(false);
      setTimeout(resolve, 600);
    });
  </script>
</body>
</html>
